<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C.O.R.E. Passenger Information</title>
<style>
  :root { --bg:#05070a; --panel:#0d1117; --line:#2a313c; --text:#f2f6fa; --dim:#8b949e; --blue:#38bdf8; --yellow:#facc15; --red:#ef4444; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family: Inter, system-ui, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  #app { height:100%; display:grid; grid-template-columns: 38% 62%; grid-template-rows: auto 1fr auto; }
  header { grid-column: 1 / 3; display:flex; align-items:center; gap:2vw; padding:1.5vh 2vw; background:var(--panel); border-bottom:2px solid var(--line); }
  #line { background:var(--blue); color:#001; font-weight:900; font-size:6vh; padding:0.5vh 2vw; border-radius:1vh; min-width:12vh; text-align:center; }
  #dest-label { color:var(--dim); font-size:2.2vh; }
  #dest { font-size:5.5vh; font-weight:800; line-height:1.05; }
  #clock { margin-left:auto; font-size:6vh; font-weight:700; font-variant-numeric: tabular-nums; }
  #next { display:flex; flex-direction:column; justify-content:center; padding:3vh 2.5vw; border-right:2px solid var(--line); gap:1.5vh; }
  #next .label { color:var(--dim); font-size:3vh; text-transform:uppercase; letter-spacing:.15em; }
  #next .name { font-size:9vh; font-weight:900; line-height:1.05; word-break:break-word; }
  #next .sub { font-size:3vh; color:var(--dim); }
  #list { overflow-y:auto; padding:2vh 2vw; scroll-behavior:smooth; }
  .stop { display:flex; align-items:center; gap:1.5vw; padding:1.4vh 1.5vw; border-radius:1.2vh; font-size:4vh; border:2px solid transparent; }
  .stop .dot { width:2.2vh; height:2.2vh; border-radius:50%; background:var(--blue); flex:none; }
  .stop .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stop .t { font-variant-numeric: tabular-nums; font-weight:700; }
  .stop.passed { color:var(--dim); } .stop.passed .dot { background:var(--dim); }
  .stop.current { background:#fff; color:#000; font-weight:800; border-color:#fff; } .stop.current .dot { background:#000; }
  .stop.cancelled { color:var(--dim); text-decoration:line-through; } .stop.cancelled .n::after { content:" — Not served"; text-decoration:none; display:inline-block; font-size:2.4vh; }
  footer { grid-column: 1 / 3; min-height:0; }
  .banner { padding:1.8vh 2vw; font-size:3.6vh; font-weight:800; text-align:center; }
  #delay { background:var(--yellow); color:#000; } #hold { background:#0ea5e9; color:#001; }
  #caption { background:var(--panel); color:var(--text); border-top:2px solid var(--line); font-weight:600; }
  .hidden { display:none !important; }
  #idle { grid-column:1/3; grid-row:2/3; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2vh; }
  #idle .big { font-size:10vh; font-weight:900; color:var(--blue); } #idle .small { font-size:3.5vh; color:var(--dim); }
  #audio-gate { position:fixed; inset:0; background:rgba(0,0,0,.85); display:flex; align-items:center; justify-content:center; font-size:5vh; font-weight:800; cursor:pointer; z-index:10; }
  #conn { position:fixed; right:1vw; bottom:1vh; font-size:2vh; color:var(--dim); }
  #conn.bad { color:var(--red); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="line">—</div>
    <div><div id="dest-label">Destination</div><div id="dest">—</div></div>
    <div id="clock">--:--:--</div>
  </header>
  <section id="next"><div class="label">Next stop</div><div class="name" id="next-name">—</div><div class="sub" id="next-sub"></div></section>
  <section id="list"></section>
  <section id="idle" class="hidden"><div class="big">C.O.R.E.</div><div class="small">Not in service</div></section>
  <footer>
    <div id="delay" class="banner hidden"></div>
    <div id="hold" class="banner hidden">Waiting for connecting train</div>
    <div id="caption" class="banner hidden"></div>
  </footer>
</div>
<div id="audio-gate" class="hidden">Tap to enable audio</div>
<div id="conn">connecting…</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var state = null;
  var AUTOPLAY = /[?&]autoplay=1/.test(location.search);

  function hm(sec) { var s = ((Math.round(sec) % 86400) + 86400) % 86400; return String(Math.floor(s / 3600)).padStart(2, "0") + ":" + String(Math.floor(s % 3600 / 60)).padStart(2, "0"); }
  function slug(t) { return String(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }
  function esc(t) { var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

  setInterval(function () { $("clock").textContent = new Date().toLocaleTimeString("en-GB", { hour12: false }); }, 250);

  // ------------------------------------------------------------------ rendering
  function upcomingIndex(s) { return s.phase === "AT_STOP" ? s.currentStopIndex + 1 : s.currentStopIndex; }

  function render() {
    var s = state;
    var active = !!(s && s.active);
    $("idle").classList.toggle("hidden", active);
    $("next").classList.toggle("hidden", !active);
    $("list").classList.toggle("hidden", !active);
    if (!active) { $("line").textContent = "—"; $("dest").textContent = "—"; return; }

    $("line").textContent = s.routeId || "—";
    $("dest").textContent = s.destination || "—";

    var up = upcomingIndex(s);
    var terminal = s.terminalIndex;
    var served = s.stops.filter(function (x) { return !x.cancelled; });
    var upStop = s.stops.filter(function (x) { return x.index === up; })[0] || served[served.length - 1];
    if (s.phase === "AT_STOP" && s.currentStopIndex >= terminal) {
      $("next").querySelector(".label").textContent = "Final stop";
      var cur = s.stops.filter(function (x) { return x.index === s.currentStopIndex; })[0];
      $("next-name").textContent = cur ? cur.name : "—";
      $("next-sub").textContent = "All passengers must alight";
    } else {
      $("next").querySelector(".label").textContent = up === terminal ? "Final stop" : "Next stop";
      $("next-name").textContent = upStop ? upStop.name : "—";
      $("next-sub").textContent = upStop ? "Scheduled " + hm(upStop.arr) : "";
    }

    var html = "";
    s.stops.forEach(function (x) {
      var cls = "stop";
      if (x.cancelled) cls += " cancelled";
      else if (x.index < s.currentStopIndex) cls += " passed";
      else if (x.index === up || (s.phase === "AT_STOP" && x.index === s.currentStopIndex)) cls += " current";
      html += '<div class="' + cls + '" data-i="' + x.index + '"><span class="dot"></span><span class="n">' + esc(x.name) + '</span><span class="t">' + hm(x.dep) + "</span></div>";
    });
    $("list").innerHTML = html;
    var cur2 = $("list").querySelector(".current");
    if (cur2) cur2.scrollIntoView({ block: "center" });

    var d = $("delay");
    if (s.delayMinutes >= 2 && !s.early) { d.textContent = "Delayed by " + s.delayMinutes + " min"; d.classList.remove("hidden"); } else d.classList.add("hidden");
    var hold = (s.advisories || []).some(function (a) { return a.kind === "HOLD"; });
    $("hold").classList.toggle("hidden", !hold);
  }

  // ------------------------------------------------------------------ speech queue
  var queue = [], speaking = false, unlocked = false, captionTimer = null;

  function caption(text) {
    var c = $("caption"); c.textContent = text; c.classList.remove("hidden");
    clearTimeout(captionTimer); captionTimer = setTimeout(function () { c.classList.add("hidden"); }, 8000);
  }

  function say(text, audioSlug) { queue.push({ text: text, slug: audioSlug || slug(text) }); pump(); }

  function pickVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^en[-_]GB/i.test(v.lang); })[0] || vs.filter(function (v) { return /^en/i.test(v.lang); })[0] || null;
  }

  function speakTts(text, done) {
    if (!window.speechSynthesis) return done();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-GB"; var v = pickVoice(); if (v) u.voice = v;
    u.onend = done; u.onerror = done;
    speechSynthesis.speak(u);
  }

  function playFile(slugName, ok, fail) {
    fetch("/audio/" + slugName + ".mp3", { method: "HEAD" }).then(function (r) {
      if (!r.ok) return fail();
      var a = new Audio("/audio/" + slugName + ".mp3");
      a.onended = ok; a.onerror = fail;
      a.play().catch(fail);
    }).catch(fail);
  }

  function pump() {
    if (speaking || !queue.length) return;
    if (!unlocked && !AUTOPLAY) { $("audio-gate").classList.remove("hidden"); }
    speaking = true;
    var item = queue.shift();
    caption(item.text);
    var finish = function () { speaking = false; pump(); };
    playFile(item.slug, finish, function () { speakTts(item.text, finish); });
  }

  $("audio-gate").addEventListener("click", function () {
    unlocked = true; $("audio-gate").classList.add("hidden");
    if (window.speechSynthesis) { speechSynthesis.cancel(); }
    speaking = false; pump();
  });
  document.addEventListener("pointerdown", function () { unlocked = true; $("audio-gate").classList.add("hidden"); }, { once: true });
  if (window.speechSynthesis) speechSynthesis.onvoiceschanged = function () {};

  function stopByIndex(i) { return state && state.stops.filter(function (x) { return x.index === i; })[0]; }

  function onEvent(f) {
    if (!state) return;
    var stop = stopByIndex(f.stopIndex);
    if (!stop) return;
    var isTerminal = f.stopIndex >= state.terminalIndex;
    if (f.kind === "DOOR_CLOSED") {
      if (isTerminal) say("This is the final stop, " + stop.name + ". All passengers must alight.", "final-stop-" + slug(stop.name));
      else say("Next stop: " + stop.name, "next-stop-" + slug(stop.name));
    } else if (f.kind === "GEOFENCE") {
      say("Approaching " + stop.name, "approaching-" + slug(stop.name));
    }
  }

  // ------------------------------------------------------------------ websocket
  var attempt = 0;
  function connect() {
    var ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws?role=display");
    ws.onopen = function () { attempt = 0; $("conn").textContent = "live"; $("conn").classList.remove("bad"); };
    ws.onmessage = function (ev) {
      var f; try { f = JSON.parse(ev.data); } catch (e) { return; }
      if (f.t === "state") { state = f.state; render(); }
      else if (f.t === "event") onEvent(f);
      else if (f.t === "announce") say(f.text, slug(f.text));
    };
    ws.onclose = function () { $("conn").textContent = "reconnecting…"; $("conn").classList.add("bad"); setTimeout(connect, Math.min(10000, 500 * Math.pow(2, attempt++))); };
    ws.onerror = function () { ws.close(); };
  }
  render();
  connect();
})();
</script>
</body>
</html>
